<title>KOMBO 羽球扭蛋抽獎</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap">
<style>
/* Layout: one narrow column — the 9:16 stage on top, the settings card below it */
:root{
  --bg:#E9EEF6; --panel:#FFFFFF; --fg:#13213D; --muted:#5A6B85; --line:#D3DCEA;
  --navy:#0D3A8C; --navy-fg:#FFFFFF; --orange:#D9531E; --field:#F4F7FC; --err:#B3261E;
  --font-display:"Baloo 2","PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-body:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1422; --panel:#162036; --fg:#E7ECF6; --muted:#9AA8C2; --line:#2A3654;
  --navy:#3E6FD8; --navy-fg:#FFFFFF; --orange:#F07A45; --field:#0F182A; --err:#FF8A80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1422; --panel:#162036; --fg:#E7ECF6; --muted:#9AA8C2; --line:#2A3654;
  --navy:#3E6FD8; --navy-fg:#FFFFFF; --orange:#F07A45; --field:#0F182A; --err:#FF8A80; color-scheme:dark}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--font-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 32px}
main{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
h1{font-family:var(--font-display);font-size:20px;font-weight:700;margin:0;color:var(--fg)}
h1 span{color:var(--orange)}
.ver{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
#stage{display:block;width:min(100%,calc((100dvh - 24px) * 9 / 16));aspect-ratio:9/16;margin:0 auto;border-radius:18px;background:#F4F7FC;max-width:100%}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:14px}
.row{display:flex;flex-direction:column;gap:6px}
.row>label,.lbl{font-size:13px;color:var(--muted)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:6px}
.seg button{padding-inline:4px}
button{font:inherit;font-size:15px;border-radius:10px;border:1px solid var(--line);background:var(--field);color:var(--fg);padding:9px 12px;cursor:pointer}
button[aria-pressed="true"]{background:var(--navy);color:var(--navy-fg);border-color:var(--navy)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
input,select{font:inherit;font-size:16px;border-radius:10px;border:1px solid var(--line);background:var(--field);color:var(--fg);padding:9px 12px;min-width:0}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:44px;padding:9px 0;font-size:18px}
.stepper output{flex:1;text-align:center;font-family:var(--font-display);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.stats{font-size:14px;line-height:1.6;background:var(--field);border-radius:10px;padding:10px 12px;font-variant-numeric:tabular-nums}
.stats b{font-weight:600;color:var(--navy)}
.err{color:var(--err);font-size:13px;min-height:1em}
.go{background:var(--orange);border-color:var(--orange);color:#fff;font-size:17px;font-weight:600;padding:13px}
.note{font-size:12px;color:var(--muted);line-height:1.6;margin:0}
.after{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
input[type="range"]{padding:0;accent-color:var(--navy);width:100%}
#psOut{color:var(--fg);font-weight:600;font-variant-numeric:tabular-nums}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:15px}
.toggle input{width:22px;height:22px;accent-color:var(--navy)}
#psOut,#osOut{color:var(--fg);font-weight:600;font-variant-numeric:tabular-nums}
.adv{display:flex;flex-direction:column;gap:14px}
[hidden]{display:none!important}
body.embed{padding-block:8px}
body.embed main{gap:10px}
body.embed #stage{width:min(100%,calc((100dvh - 100px) * 9 / 16))}
#playWrap{display:flex;flex-direction:column;gap:8px}
details summary{cursor:pointer;font-size:13px;color:var(--muted)}
details[open] summary{margin-bottom:10px}
</style>

<main>
  <header>
    <h1>KOMBO <span>扭蛋抽獎</span></h1>
    <span class="ver" id="ver"></span>
  </header>

  <canvas id="stage" aria-label="羽毛球扭蛋機抽獎動畫"></canvas>

  <section id="playWrap" hidden><button class="go" id="play">開始抽獎</button></section>

  <section class="card" id="after" hidden>
    <div class="after">
      <button id="again" class="go">再抽一次</button>
      <button id="edit">修改設定</button>
    </div>
  </section>

  <section class="card" id="panel">
    <div class="row">
      <span class="lbl">平台</span>
      <div class="seg" id="platform">
        <button type="button" data-v="IG" aria-pressed="true">IG</button>
        <button type="button" data-v="FB" aria-pressed="false">FB</button>
        <button type="button" data-v="Threads" aria-pressed="false">Threads</button>
      </div>
    </div>
    <div class="two">
      <div class="row"><label for="kw">關鍵字</label><input id="kw" value="+1" placeholder="不限"></div>
      <div class="row"><label for="tags">標記人數</label>
        <select id="tags"><option value="0">不限</option><option value="1">至少 1 位</option><option value="2">至少 2 位</option><option value="3">至少 3 位</option></select></div>
    </div>
    <div class="two">
      <div class="row"><span class="lbl">投入 K 幣（抽幾位）</span>
        <div class="stepper"><button type="button" id="wMinus" aria-label="少抽一位">−</button><output id="wOut">4</output><button type="button" id="wPlus" aria-label="多抽一位">+</button></div></div>
      <div class="row"><span class="lbl">每批紙條</span>
        <div class="seg" id="batch">
          <button type="button" data-v="10" aria-pressed="false">10</button>
          <button type="button" data-v="20" aria-pressed="true">20</button>
          <button type="button" data-v="30" aria-pressed="false">30</button>
        </div></div>
    </div>
    <details>
      <summary>進階設定（速度、音效、測試資料）</summary>
      <div class="adv">
      <div class="row"><label for="pspeed">紙條速度：<output id="psOut"></output></label>
        <input type="range" id="pspeed" min="0.5" max="1.5" step="0.1"></div>
      <div class="row"><label for="ospeed">開蛋速度：<output id="osOut"></output></label>
        <input type="range" id="ospeed" min="0.5" max="1.5" step="0.1"></div>
      <div class="toggle"><label for="sound">音效</label><input type="checkbox" id="sound" checked></div>
      <div class="two">
        <div class="row"><label for="fakeN">假留言數量</label><input id="fakeN" type="number" min="10" max="2000" step="1" value="366" inputmode="numeric"></div>
        <div class="row"><label for="own">排除帳號</label><input id="own" value="kombo_badminton"></div>
      </div>
      </div>
    </details>
    <div class="stats" id="stats"></div>
    <div class="err" id="err" role="alert"></div>
    <button class="go" id="start">開始抽獎</button>
    <p class="note">目前使用測試留言。得主在按下開始時由瀏覽器的安全亂數決定，同一帳號只會中一次；扭蛋動畫是把結果演出來。</p>
  </section>
</main>

/* ---------- helpers ---------- */
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const eOut=t=>1-Math.pow(1-t,3), eIn=t=>t*t*t, eIO=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const eBack=t=>{const c=1.70158,c3=c+1;return 1+c3*Math.pow(t-1,3)+c*Math.pow(t-1,2)};
const eBounce=t=>{const n=7.5625,d=2.75;if(t<1/d)return n*t*t;if(t<2/d)return n*(t-=1.5/d)*t+.75;if(t<2.5/d)return n*(t-=2.25/d)*t+.9375;return n*(t-=2.625/d)*t+.984375};
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function secureInt(n){const b=new Uint32Array(1);const lim=Math.floor(4294967296/n)*n;let x;do{crypto.getRandomValues(b);x=b[0]}while(x>=lim);return x%n}
function rr(g,x,y,w,h,r){r=Math.min(r,w/2,h/2);g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function fit(g,t,maxW){if(g.measureText(t).width<=maxW)return t;let s=t;while(s.length&&g.measureText(s+'…').width>maxW)s=s.slice(0,-1);return s+'…'}
function wrap(g,t,maxW,maxLines){const lines=[];let cur='';for(const ch of [...t]){if(g.measureText(cur+ch).width>maxW&&cur){lines.push(cur);cur=ch;if(lines.length===maxLines)break}else cur+=ch}
  if(lines.length<maxLines&&cur)lines.push(cur);else if(lines.length===maxLines&&cur){lines[maxLines-1]=fit(g,lines[maxLines-1]+cur,maxW)}
  const used=lines.join('').length;if(used<[...t].length&&lines.length)lines[lines.length-1]=fit(g,lines[lines.length-1]+'……',maxW);return lines}
const mentions=t=>(t.match(/@[A-Za-z0-9_.]+/g)||[]).length;

  const r=mulberry32(20261030+n), pick=a=>a[Math.floor(r()*a.length)];
  const syl=['amy','ben','coco','dan','eva','fish','gogo','hana','ivy','jj','kai','lulu','mia','nini','oli','ping','ray','sam','tina','vic','wen','xin','yuyu','zoe','chen','lin','wang','huang','liu','tsai','yang','kuo','hsu','lee','momo','tommy','sandy','leo','kiki','may'];
  const suf=['_bd','.smash','_shuttle','88','921','_tw','.play','_k','','_badminton','.c','66','_lin','0712','.yo'];
  const users=new Set();const nu=Math.max(12,Math.round(n*0.72));while(users.size<nu)users.add(pick(syl)+pick(suf)+(r()<.25?Math.floor(r()*90+10):''));
  const ul=[...users], m=()=>'@'+pick(syl)+pick(['','_','.k','88']);
  const good=['+1 想要 {m}','+1 跟 {m} 一起打球','+1 好想中 {m} {m}','+1 KOMBO 練習球讚','+1 拜託讓我中一次','+1 {m} 快來','+1 週末球隊用 {m}','+1 想要一桶 {m}','+1 必備！','+1 我要我要 {m} {m}','+1 抽我抽我','+1 打球必備 {m}','+1 祝我好運','+1 謝謝 KOMBO {m}','+1 想試試新球 {m} {m}','+1 羽球人必抽','+1 我們球隊每週都打，想要試試看 KOMBO 的比賽球 {m} {m}','+1 {m} {m} {m} 一起來'];
  const bad=['請問多少錢？','好漂亮','已分享','怎麼買','好想要喔','可以寄外島嗎','{m} 你看'];
  const fill=s=>s.replace(/\{m\}/g,m);
  const own=2, nb=Math.round(n*0.033), ng=n-own-nb, out=[];
  for(let i=0;i<ng;i++)out.push({user:pick(ul),text:fill(pick(good))});
  for(let i=0;i<nb;i++)out.push({user:pick(ul),text:fill(pick(bad))});
  out.push({user:'kombo_badminton',text:'+1 謝謝大家參加！'},{user:'kombo_badminton',text:'+1 開獎時間見貼文說明'});
  for(let i=out.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[out[i],out[j]]=[out[j],out[i]]}
  out.forEach(e=>e.color=r()<.5?C.capO:C.capB);
  return out;
}

function tone(fr,dur,type='sine',gain=.06,to=null,delay=0){const a=audio();if(!a)return;const t=a.currentTime+delay,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(fr,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+dur);g.gain.setValueAtTime(gain,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(a.destination);o.start(t);o.stop(t+dur+.02)}
function noise(dur,freq,gain=.05,delay=0){const a=audio();if(!a)return;const t=a.currentTime+delay,len=Math.floor(a.sampleRate*dur),b=a.createBuffer(1,len,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);
  const s=a.createBufferSource(),bp=a.createBiquadFilter(),g=a.createGain();s.buffer=b;bp.type='bandpass';bp.frequency.value=freq;g.gain.value=gain;s.connect(bp).connect(g).connect(a.destination);s.start(t)}

function drawCap(g,x,y,r,col,open=0,paper=true,alpha=1,rot=0){

  g.beginPath();g.arc(0,0,r,Math.PI,Math.PI*2);g.closePath();g.fillStyle='rgba(255,255,255,0.38)';g.fill();
  g.strokeStyle=r>4?C.shell:'rgba(94,123,176,.8)';g.lineWidth=r>4?Math.min(1.4,r*.08):.6;g.stroke();
  if(r>6){g.beginPath();g.arc(0,0,r*.72,Math.PI*1.15,Math.PI*1.45);g.strokeStyle='rgba(255,255,255,.95)';g.lineWidth=Math.max(1,r*.09);g.lineCap='round';g.stroke()}

function drawStrip(g,e,x,y,rot,frac,scale,alpha){

/* ---------- pile ---------- */
let SLOTS=[],PILE_R=6;
function makeSlots(n){let best=null;for(let r=9;r>=2.5;r-=.25){const s=[],dy=r*1.74;let row=0;for(let y=G.botY-r-3;y>G.topY+26;y-=dy,row++){const a=xL(y)+r+3,b=xR(y)-r-3;for(let x=a+(row%2?r:0);x<=b;x+=r*2)s.push({x,y,row})}
    if(s.length>=n){best={r,s};break}best={r,s}}
  PILE_R=best.r;const rnd=mulberry32(7);const s=best.s.map(p=>({...p,k:p.row+rnd()*.9}));s.sort((a,b)=>a.k-b.k);
  SLOTS=s.slice(0,n).map(p=>({x:p.x+(rnd()-.5)*1.2,y:p.y,color:C.capB,rot:rnd()*6,landed:false,removed:false}))}
function rebuildPile(){pg.setTransform(1,0,0,1,0,0);pg.clearRect(0,0,pileCv.width,pileCv.height);pg.setTransform(SC,0,0,SC,0,0);for(const s of SLOTS)if(s.landed&&!s.removed)drawCap(pg,s.x,s.y,PILE_R,s.color,0,true,1,s.rot)}
function landSlot(s){s.landed=true;pg.setTransform(SC,0,0,SC,0,0);drawCap(pg,s.x,s.y,PILE_R,s.color,0,true,1,s.rot)}

/* ---------- run state ---------- */
let run=null;
const CYCLE=1050,COIN=1900,OPEN=2800;
function startRun(){
  refresh();if($('err').textContent)return;
  audio();try{navigator.wakeLock&&navigator.wakeLock.request('screen').catch(()=>{})}catch(e){}
  const entries=POOL.map(e=>({...e})),N=entries.length,B=S.batch,SP=S.paperSpeed,FORM=CYCLE/SP,OSP=S.openSpeed,OPENd=OPEN/OSP;
  // draw winners first (secure random, one win per account)
  let pool=entries.slice();const winners=[];
  if(DATA){DATA.winners.forEach(i=>winners.push(entries[i]))}
  else for(let i=0;i<S.winners&&pool.length;i++){const w=pool[secureInt(pool.length)];winners.push(w);pool=pool.filter(e=>e.user!==w.user)}
  makeSlots(N);
  const rnd=mulberry32(Date.now()&0xffff);const order=entries.slice().sort(()=>rnd()-.5);
  const batches=[];
  for(let b=0;b*B<N;b++){const items=order.slice(b*B,b*B+B);const rows=Math.ceil(items.length/3),top=82,bot=330,rh=(bot-top)/Math.max(rows,1);
    const cells=[];for(let r=0;r<rows;r++)for(let c=0;c<3;c++)cells.push({x:64+c*116,y:top+rh*(r+.5)});cells.sort(()=>rnd()-.5);
    batches.push({start:b*FORM,items:items.map((e,i)=>{const cell=cells[i];const slot=SLOTS[b*B+i];slot.color=e.color;
      return{e,slot,x:cell.x+(rnd()-.5)*26,y:cell.y+(rnd()-.5)*Math.min(10,rh*.4),rot:(rnd()-.5)*.28,d:rnd()*90,fly:560+rnd()*160,ex:G.entry.x+(rnd()-.5)*70,side:rnd()<.5?-1:1,done:false}})})}
  const loadEnd=(batches.length-1)*FORM+90+720+FORM+300;
  const coinStart=loadEnd+600, openStart=coinStart+winners.length*COIN+400, finalStart=openStart+winners.length*OPENd+300;
  const now=new Date();const ds=`${now.getFullYear()}/${String(now.getMonth()+1).padStart(2,'0')}/${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  ctx.font=f(13);
  run={T:0,last:null,sp:SP,FORM,osp:OSP,OPEN:OPENd,N,B,batches,winners,landed:0,loadEnd,coinStart,openStart,finalStart,titleAt:finalStart+700+2500,fired:new Set(),date:ds,platform:S.platform,kw:S.kw,feathers:[],shown:false};
  rebuildPile();
  $('panel').hidden=true;$('after').hidden=true;
  cv.scrollIntoView({behavior:'smooth',block:'center'});
  requestAnimationFrame(loop);
}
function fire(k,fn){if(!run.fired.has(k)){run.fired.add(k);fn()}}
function loop(now){if(!run)return;if(run.last==null)run.last=now;run.T+=Math.min(80,now-run.last)*(window.__speed||1);run.last=now;draw(run.T);requestAnimationFrame(loop)}

function traySlot(k,n){const sp=Math.min(26,136/n),r=Math.min(11,sp/2-1.5);return{x:180-(n-1)*sp/2+k*sp,y:499,r}}
function barRect(k,n){const cols=Math.min(n,4),w=(332-(cols-1)*6)/cols;return{x:14+(k%cols)*(w+6),y:62+Math.floor(k/cols)*36,w,h:30}}
function finalRect(k,n){
  if(n<=5){const h=n<=3?84:66,gap=12,tot=n*h+(n-1)*gap,y0=Math.max(104,338-tot/2);return{x:34,y:y0+k*(h+gap),w:292,h}}
  const rows=Math.ceil(n/2),gap=n<=10?10:7,h=Math.min(78,(474-(rows-1)*gap)/rows),y0=104+(474-(rows*h+(rows-1)*gap))/2;return{x:k%2?186:16,y:y0+Math.floor(k/2)*(h+gap),w:158,h}}
function frontRect(e){ctx.font=f(13);const lines=Math.min(3,wrap(ctx,e.text,236,3).length);const h=14*2+16+4+lines*19;return{x:180-132,y:236-h/2,w:264,h}}
const lerpR=(a,b,t)=>({x:lerp(a.x,b.x,t),y:lerp(a.y,b.y,t),w:lerp(a.w,b.w,t),h:lerp(a.h,b.h,t)});

function draw(T){
  const g=ctx,R=run;g.setTransform(SC,0,0,SC,0,0);g.fillStyle=C.stage;g.fillRect(0,0,W,H);
  const n=R.winners.length;
  // --- machine state
  let crankA=0,shake=0;
  for(let k=0;k<n;k++){const a=T-(R.coinStart+k*COIN)-750;if(a>0){crankA+=eIO(clamp(a/600))*Math.PI*2;if(a<600)shake=Math.sin(Math.PI*a/600)}}
  const mAlpha=T>R.finalStart?lerp(1,.2,eIO(clamp((T-R.finalStart)/700))):1;
  // --- process landings
  const active=[];
  for(const b of R.batches){const t=T-b.start;if(t<0)break;for(const it of b.items){const land=it.d+R.FORM+it.fly+260;if(!it.done&&t>=land){it.done=true;landSlot(it.slot);R.landed++;SND.tick()}}
    if(t<R.FORM+1400&&b.items.some(it=>!it.done))active.push(b);
    if(t>=0)fire('ap'+b.start,SND.appear);if(t>=520/R.sp)fire('fo'+b.start,SND.fold)}
  // removals for ejected capsules
  for(let k=0;k<n;k++){if(T-(R.coinStart+k*COIN)>=1250)fire('rm'+k,()=>{const col=R.winners[k].color;const cand=SLOTS.filter(s=>s.landed&&!s.removed);cand.sort((a,b)=>Math.abs(a.x-180)+(G.botY-a.y)*1.5-(Math.abs(b.x-180)+(G.botY-b.y)*1.5));
    const pick=cand.slice(0,20).find(s=>s.color===col)||cand[0];if(pick){pick.removed=true;rebuildPile()}})}
  // --- draw machine
  g.save();g.globalAlpha=mAlpha;
  drawDomeBack(g);
  const sx=shake*Math.sin(T*.09)*2.2,sy=shake*Math.cos(T*.13)*1.4;
  g.save();g.setTransform(1,0,0,1,sx*SC,sy*SC);g.drawImage(pileCv,0,0);g.restore();g.setTransform(SC,0,0,SC,0,0);
  // falling capsules (inside dome)
  for(const b of active){const t=T-b.start;for(const it of b.items){if(it.done)continue;const f0=it.d+R.FORM+it.fly;if(t>=f0){const p=eIn(clamp((t-f0)/260));drawCap(g,lerp(it.ex,it.slot.x,p),lerp(G.entry.y,it.slot.y,p),PILE_R,it.e.color,0,true,1,it.slot.rot*p)}}}
  drawDomeFront(g);drawBase(g,crankA);
  // tray capsules (ejected, not yet taken to open)
  for(let k=0;k<n;k++){const a=T-(R.coinStart+k*COIN),ts=traySlot(k,n),w=R.winners[k];const oa=T-(R.openStart+k*R.OPEN);
    if(a<1250||oa>=0)continue;const q=clamp((a-1250)/600);
    if(q<.22){const s=eOut(q/.22);drawCap(g,G.out.x,G.out.y,ts.r*lerp(.4,1,s),w.color,0,true,1)}
    else{const p=(q-.22)/.78;drawCap(g,lerp(G.out.x,ts.x,eOut(p)),lerp(G.out.y,ts.y,eBounce(p)),ts.r,w.color,0,true,1,p*Math.PI*2*(ts.x>G.out.x?1:-1))}
    if(a>=1250)fire('ej'+k,SND.thunk);}
  g.restore();
  // --- flying capsules (front → back, smaller first)
  const fly=[];for(const b of active){const t=T-b.start;for(const it of b.items){if(it.done)continue;const s0=it.d+R.FORM;if(t>=s0&&t<s0+it.fly)fly.push({it,p:(t-s0)/it.fly})}}
  fly.sort((a,b)=>b.p-a.p);
  for(const {it,p} of fly){const q=eIO(p),cx=lerp(it.x,it.ex,.35)+it.side*30,cy=-30;const x=(1-q)*(1-q)*it.x+2*(1-q)*q*cx+q*q*it.ex,y=(1-q)*(1-q)*(it.y+3)+2*(1-q)*q*cy+q*q*G.entry.y;drawCap(g,x,y,lerp(15,PILE_R,eOut(q)),it.e.color,0,true,1,q*it.side*2)}
  // --- forming strips (current batches)
  for(const b of active){const t=T-b.start;for(const it of b.items){const a=(t-it.d)*R.sp;if(a<0||a>=1050)continue;const cr=15,cx=it.x,cy=it.y+3;
    if(a>=430){const s=eBack(clamp((a-430)/150));const open=a<930?1:1-eIO(clamp((a-930)/110));drawCap(g,cx,cy,cr*s,it.e.color,open,a>=900,1)}
    if(a<930){let frac=1,sc=1,al=1,x=it.x,y=it.y,rot=it.rot;
      if(a<220){sc=lerp(.55,1,eBack(a/220));al=a/220}
      if(a>=480)frac=lerp(1,.5,eIO(clamp((a-480)/160)));if(a>=640)frac=lerp(.5,.25,eIO(clamp((a-640)/160)));
      if(a>=480)rot=lerp(it.rot,0,clamp((a-480)/320));
      if(a>=800){const p=eIn(clamp((a-800)/130));sc=lerp(1,.4,p);y=lerp(it.y,cy+2,p);al=1-p*.4}
      drawStrip(g,it.e,x,y,rot,frac,sc,al)}}}
  // --- coins
  for(let k=0;k<n;k++){const a=T-(R.coinStart+k*COIN);if(a<0||a>=750)continue;
    if(a<150)drawCoin(g,180,572,44*eBack(a/150),1);
    else{const p=eIO((a-150)/600),x=(1-p)*(1-p)*180+2*(1-p)*p*60+p*p*(G.slot.x+4.5),y=(1-p)*(1-p)*572+2*(1-p)*p*520+p*p*(G.slot.y+12);drawCoin(g,x,y,lerp(44,6,p),Math.cos(p*Math.PI*4))}}
  for(let k=0;k<n;k++){const a=T-(R.coinStart+k*COIN);if(a>=750)fire('co'+k,()=>{SND.coin();setTimeout(SND.crank,120)})}
  // --- opening + cards
  const finalP=T>R.finalStart?eIO(clamp((T-R.finalStart)/700)):0;
  for(let k=0;k<n;k++){const e=R.winners[k],a=(T-(R.openStart+k*R.OPEN))*R.osp;if(a<0)continue;const ts=traySlot(k,n),FR=frontRect(e),BR=barRect(k,n);
    if(a<500){const p=eIO(a/500);drawCap(g,lerp(ts.x,180,p),lerp(ts.y,300,p),lerp(ts.r,46,p),e.color,0,true,1)}
    else if(a<2300){const open=eOut(clamp((a-500)/250));if(a>=500)fire('op'+k,SND.open);
      const capA=1-clamp((a-1150)/300);drawCap(g,180,300+(1-capA)*20,46,e.color,open,a<650,capA);
      if(a>=650){const q=clamp((a-650)/500);const frac=q<.5?lerp(.22,.5,eIO(q*2)):lerp(.5,1,eIO((q-.5)*2));const sc=lerp(.35,1,eOut(q));
        const w=FR.w*frac*sc,h=FR.h*sc,cy=lerp(290,FR.y+FR.h/2,eOut(q));drawCard(g,e,{x:180-w/2,y:cy-h/2,w,h},0,clamp((frac-.9)/.1))}}
    else{const mv=eIO(clamp((a-2300)/500));let Rc=lerpR(FR,BR,mv);if(finalP>0)Rc=lerpR(BR,finalRect(k,n),finalP);
      const rot=finalP*(k%2?.03:-.03);drawCard(g,e,Rc,rot,mv>0&&mv<1?clamp(Math.abs(mv-.5)*2):1)}}
  // --- header texts
  g.textAlign='left';g.textBaseline='alphabetic';
  if(T<R.finalStart+300){g.globalAlpha=T>R.finalStart?1-clamp((T-R.finalStart)/300):1;
    g.fillStyle=C.navy;g.font=f(18,700);g.fillText(`${R.platform} 抽獎`,18,34);g.fillStyle=C.muted;g.font=f(11);g.fillText(`${R.kw?`關鍵字「${R.kw}」· `:''}${R.N} 則參加`,18,51);
    if(T<R.coinStart-200)pill(g,226,18,118,30,`已投入 ${R.landed} / ${R.N}`);
    else{let c=0;for(let k=0;k<n;k++)if(T-(R.coinStart+k*COIN)>=750)c++;pill(g,262,18,82,30,`${c} / ${n}`,true)}
    g.globalAlpha=1}
  // --- final
  if(T>=R.titleAt){const a=T-R.titleAt;fire('fan',()=>{SND.fanfare();for(let i=0;i<70;i++)R.feathers.push(newFeather(true))});
    
    g.globalAlpha=clamp(a/500);g.fillStyle=C.muted;g.font=f(12);g.textAlign='center';g.fillText(`${R.platform} · ${R.N} 則參加 · ${R.date}`,180,616);g.globalAlpha=1;
    if(a>600&&R.feathers.length<46&&Math.random()<.25)R.feathers.push(newFeather(false));
    const dt=16;R.feathers=R.feathers.filter(p=>p.y<H+30);for(const p of R.feathers){p.ph+=.04;p.x+=p.vx+Math.sin(p.ph)*.6;p.y+=p.vy;p.rot+=p.vr+Math.sin(p.ph)*.01;drawFeather(g,p.x,p.y,p.rot,p.len,p.col,p.edge)}
    const s=a<380?eBack(a/380):1;g.save();g.translate(180,70);g.scale(s,s);g.textAlign='center';g.font=f(34,700);g.lineJoin='round';g.lineWidth=6;g.strokeStyle='#fff';g.strokeText('恭喜中獎！',0,0);g.fillStyle=C.orange;g.fillText('恭喜中獎！',0,0);g.restore();
    if(a>1500&&!R.shown){R.shown=true;$('after').hidden=false}}
}
function newFeather(burst){const o=Math.random()<.5;return{x:Math.random()*W,y:burst?-20-Math.random()*260:-20,vx:(Math.random()-.5)*.5,vy:.7+Math.random()*1.1,rot:Math.random()*6,vr:(Math.random()-.5)*.03,ph:Math.random()*6,len:16+Math.random()*12,col:o?'#F08A5D':'#6F95D6',edge:o?'#A63C12':C.navy}}

function drawIdle(){const g=ctx;g.setTransform(SC,0,0,SC,0,0);g.fillStyle=C.stage;g.fillRect(0,0,W,H);
  drawDomeBack(g);drawDomeFront(g);drawBase(g,0);
  g.textAlign='left';g.textBaseline='alphabetic';g.fillStyle=C.navy;g.font=f(18,700);g.fillText(`${S.platform} 抽獎`,18,34);
  g.fillStyle=C.muted;g.font=f(11);g.fillText(`${S.kw?`關鍵字「${S.kw}」· `:''}${POOL.length} 則參加`,18,51);
  pill(g,262,18,82,30,`0 / ${S.winners}`,true);
  g.textAlign='center';g.fillStyle=C.muted;g.font=f(13);g.fillText(DATA?'按下方「開始抽獎」開始':'按下「開始抽獎」投入所有留言',180,580)}

$('start').onclick=startRun;
$('play').onclick=()=>{$('playWrap').hidden=true;startRun()};
$('again').onclick=()=>{run=null;SLOTS=[];rebuildPile();startRun()};
$('edit').onclick=()=>{run=null;SLOTS=[];rebuildPile();$('after').hidden=true;$('panel').hidden=false;drawIdle();$('panel').scrollIntoView({behavior:'smooth'})};
window.__gacha={get run(){return run},start:startRun};

if(DATA){
  document.body.classList.add('embed');
  Object.assign(S,DATA.settings||{});
  const r=mulberry32(DATA.entries.length*7919+13);DATA.entries.forEach(e=>{if(!e.color)e.color=r()<.5?C.capO:C.capB});
  document.querySelector('header').hidden=true;$('panel').hidden=true;$('playWrap').hidden=false;
  $('again').textContent='重播一次';$('edit').hidden=true;$('after').querySelector('.after').style.gridTemplateColumns='1fr';
}
refresh();
(document.fonts?document.fonts.load(f(18,700)).catch(()=>{}):Promise.resolve()).then(()=>{resize()});
KLOGO.onload=()=>{if(!run)drawIdle()};
resize();
</script>
